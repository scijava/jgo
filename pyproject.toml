[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jgo"
version = "3.0.1.dev0"
description = "Launch Java code from Python and the CLI, installation-free."
license = "Unlicense"
authors = [{name = "Appose developers", email = "ctrueden@wisc.edu"}]
readme = "README.md"
keywords = ["java", "maven", "launch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Java Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Shells",
    "Topic :: System :: System Shells",
    "Topic :: Utilities",
]

requires-python = ">=3.10"
dependencies = [
  "cjdk>=0.4.0",
  "psutil>=7",
  # Previous versions vendored urllib3/packages/six.py, resulting in failures
  "requests>=2.16.0",
  "semver>=3.0.0",
  "tomli>=2.0.0; python_version<'3.11'",
  "tomli-w>=1.0.0",
  "urllib3>=2",
]

[project.optional-dependencies]
cli = [
  "rich>=14.2.0",
  "rich-click>=1.9.5",
]

[dependency-groups]
cli = [
    "rich>=14.2.0",
    "rich-click>=1.9.5",
]
dev = [
    "build>=1.2.2",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "types-Pygments>=2.20.0",
    "types-colorama>=0.4.15",
    "types-psutil>=7.2.2",
    "types-requests>=2.33.0",
    "validate-pyproject[all]>=0.25",
    {include-group = "cli"},
]

[project.scripts]
jgo = "jgo.__main__:main"

[project.urls]
homepage = "https://github.com/apposed/jgo"
documentation = "https://jgo.apposed.org/"
source = "https://github.com/apposed/jgo"
download = "https://pypi.org/project/jgo/"
tracker = "https://github.com/apposed/jgo/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
jgo = ["py.typed"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
extend-exclude = ["bin", "build", "dist"]

[tool.ruff.lint]
extend-select = ["TC", "UP037"]
extend-ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
"__init__.py" = ["E402", "F401"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
